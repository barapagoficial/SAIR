name: Validar

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extraer el script embebido de index.html
        run: |
          node -e "
            const fs=require('fs');
            const s=fs.readFileSync('index.html','utf8');
            const i=s.indexOf('<script src=\"supabase.js\"></script>');
            const a=s.indexOf('<script>',i)+8;
            const b=s.indexOf('</script>',a);
            fs.writeFileSync('app.check.js', s.slice(a,b));
            console.log('script extraído:', b-a, 'bytes');
          "

      - name: Sintaxis del JavaScript embebido
        run: node --check app.check.js

      - name: Funciones duplicadas de nivel superior
        run: |
          npm i --no-save acorn@8 >/dev/null 2>&1
          node -e "
            const fs=require('fs'), acorn=require('acorn');
            const src=fs.readFileSync('app.check.js','utf8');
            const ast=acorn.parse(src,{ecmaVersion:2022,sourceType:'script'});
            const nombres=[];
            for(const n of ast.body){
              if(n.type==='FunctionDeclaration') nombres.push(n.id.name);
              if(n.type==='VariableDeclaration') for(const d of n.declarations)
                if(d.id.type==='Identifier'&&d.init&&['ArrowFunctionExpression','FunctionExpression'].includes(d.init.type))
                  nombres.push(d.id.name);
            }
            const c={}; for(const n of nombres) c[n]=(c[n]||0)+1;
            const dup=Object.entries(c).filter(([,v])=>v>1);
            if(dup.length){ console.error('Funciones duplicadas:', dup); process.exit(1); }
            console.log('Sin funciones duplicadas ('+nombres.length+' declaraciones).');
          "

      - name: Validación del HTML
        run: |
          npx --yes html-validate@8 index.html && echo "HTML válido" || echo "::warning::html-validate reportó avisos (ver el log)"

      - name: La versión sale solo de version.js
        run: |
          node -e "
            const fs=require('fs'), vm=require('vm');
            const ctx={}; ctx.self=ctx; vm.runInNewContext(fs.readFileSync('version.js','utf8'),ctx);
            const v=ctx.SAIR_VERSION;
            if(!v||!/^\\d+\\.\\d+\\.\\d+$/.test(v.numero)){ console.error('version.js no define SAIR_VERSION.numero (x.y.z)'); process.exit(1); }
            console.log('Versión:', v.texto, '| caché:', v.cache);
            const w=fs.readFileSync('sw.js','utf8'), i=fs.readFileSync('index.html','utf8');
            if(!w.includes(\"importScripts('./version.js')\")){ console.error('sw.js no importa version.js'); process.exit(1); }
            if(!i.includes('<script src=\"version.js\"></script>')){ console.error('index.html no carga version.js'); process.exit(1); }
            if(/\\d+\\.\\d+\\.\\d+ Oficial/.test(i.replace(/\\/\\*[\\s\\S]*?\\*\\//g,''))){ console.error('index.html tiene una versión escrita a mano; usa data-sair-version'); process.exit(1); }
            const c=fs.readFileSync('Changelog.txt','utf8');
            if(!c.includes('['+v.texto+']')) console.log('::warning::Changelog.txt no tiene entrada para '+v.texto);
          "
